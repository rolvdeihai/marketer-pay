# backend/gqlgen.yml
schema:
  - graph/*.graphqls

exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  package: graph
  layout: follow-schema
  dir: graph
  filename_template: "{name}.resolvers.go"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int      # GraphQL Int  -> Go int
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int64    # custom scalar -> Go int64 (money)
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time     # RFC3339 timestamps -> time.Time